name: Build Torque Voice APK
on:
  push:
    branches: [torque-voice-build]
    paths:
      - "torque-voice/**"
      - ".github/workflows/torque-voice-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMGR" ]; then echo "Android sdkmanager unavailable"; exit 1; fi
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"
      - name: Bundle licensed offline Vosk models
        run: |
          set -euo pipefail
          mkdir -p torque-voice/app/src/main/assets
          curl -fL --retry 3 --retry-delay 3 --connect-timeout 25 --max-time 360 \
            https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip \
            -o torque-voice/app/src/main/assets/vosk-english.zip
          curl -fL --retry 3 --retry-delay 3 --connect-timeout 25 --max-time 240 \
            https://alphacephei.com/vosk/models/vosk-model-spk-0.4.zip \
            -o torque-voice/app/src/main/assets/vosk-speaker.zip
          unzip -tq torque-voice/app/src/main/assets/vosk-english.zip
          unzip -tq torque-voice/app/src/main/assets/vosk-speaker.zip
          ls -lh torque-voice/app/src/main/assets/
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile installable Android APK
        run: gradle -p torque-voice --no-daemon --stacktrace :app:assembleDebug
      - name: Copy installable APK
        run: cp torque-voice/app/build/outputs/apk/debug/app-debug.apk Torque-Voice-0.7.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TORQUE-Voice-APK
          path: Torque-Voice-0.7.apk
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view torque-voice-v0.7.0 >/dev/null 2>&1; then
            gh release upload torque-voice-v0.7.0 Torque-Voice-0.7.apk --clobber
          else
            gh release create torque-voice-v0.7.0 Torque-Voice-0.7.apk --target "${GITHUB_SHA}" --title "TORQUE Voice 0.7 — Android APK" --notes "TORQUE v0.7 experimental screen-off microphone: user-started Android microphone foreground service, persistent notification with Stop button, offline Vosk conversation, optional imported local GGUF inference, audio focus, no boot receiver or covert recording. GPS/arrival remains foreground-only. No auto-restart. Screen-off audio interruption and model inference require physical-device testing. Choose a context while app is open; private mode requires explicit confirmation. Full release test result: APK compile only; not device tested."
          fi
