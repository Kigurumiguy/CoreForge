name: Build Torque Voice APK
on:
  push:
    branches: [torque-voice-build]
    paths:
      - "torque-voice/**"
      - ".github/workflows/torque-voice-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMGR" ]; then echo "Android sdkmanager unavailable"; exit 1; fi
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"
      - name: Bundle licensed offline Vosk models
        run: |
          set -euo pipefail
          mkdir -p torque-voice/app/src/main/assets
          curl -fL --retry 3 --retry-delay 3 --connect-timeout 25 --max-time 360 \
            https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip \
            -o torque-voice/app/src/main/assets/vosk-english.zip
          curl -fL --retry 3 --retry-delay 3 --connect-timeout 25 --max-time 240 \
            https://alphacephei.com/vosk/models/vosk-model-spk-0.4.zip \
            -o torque-voice/app/src/main/assets/vosk-speaker.zip
          unzip -tq torque-voice/app/src/main/assets/vosk-english.zip
          unzip -tq torque-voice/app/src/main/assets/vosk-speaker.zip
          ls -lh torque-voice/app/src/main/assets/
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile installable Android APK
        run: gradle -p torque-voice --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Copy installable APK
        run: cp torque-voice/app/build/outputs/apk/debug/app-debug.apk Torque-Voice-1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TORQUE-Voice-APK
          path: Torque-Voice-1.0.apk
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view torque-voice-v1.0.0 >/dev/null 2>&1; then
            gh release upload torque-voice-v1.0.0 Torque-Voice-1.0.apk --clobber
          else
            gh release create torque-voice-v1.0.0 Torque-Voice-1.0.apk --target "${GITHUB_SHA}" --title "TORQUE Voice 1.0 — Android APK" --notes "TORQUE Voice v1.0 OFFLINE ROAD-TRIP BETA: offline-English TTS selection without hidden network voice fallback; explicit in-app Michigan Trip readiness screen; owner-reported drowsiness prompts a pull-over-and-rest response; user-started screen-off service now uses time-bounded CPU wake lock and up to two mic recovery attempts. Includes bundled offline Vosk STT/speaker models, voice turn control, Android audio AEC status, optional locally imported GGUF inference, work/guest/private modes, saved place pins. GitHub Android build and unit tests are required; NOT tested on real phone, airplane mode, or multi-hour trip. No GGUF weights bundled; navigation and GPS in screen-off service are not supported. See torque-voice/ROAD_TRIP_README_v1_0.md for transparent setup and limitations."
          fi
